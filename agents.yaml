# 단계 에이전트 사원증. read 밖의 칸을 읽거나 write 밖의 칸을 쓰면 실행을 멈춘다.
agents:
  intake:
    badge: AG-01
    name: 접수 에이전트
    scope: 꼴 검사, 빈 칸 검사, 개인정보 꼴 차단
    read: [raw]
    write: [intake]
  documents:
    badge: AG-02
    name: 서류 에이전트
    scope: 담보별 필요 서류 대조, 견적과 진단 값 정리
    read: [intake]
    write: [docs]
  fault:
    badge: AG-03
    name: 과실 에이전트
    scope: 진술 요소 추출(AI 또는 단서), 근거 확인, 진술 대조, 도표 고르기. 업계 과실비율 에이전트가 맡는 자리
    read: [intake]
    write: [elements, fault]
  route:
    badge: AG-04
    name: 경로 에이전트
    scope: 규칙표로 심사 경로 판정
    read: [intake, docs, elements, fault, grades]
    write: [route]
  schedule:
    badge: AG-05
    name: 일정 에이전트
    scope: 경상 대인 8주 일정 계산
    read: [intake, docs]
    write: [schedule]
  notice:
    badge: AG-06
    name: 안내 에이전트
    scope: 고객 안내문 작성과 숫자, 금지 표현 검사
    read: [intake, docs, fault, route, schedule]
    write: [notice]
