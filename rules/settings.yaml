# 설정값. 모두 가상 기준이며, 확인 전인 값은 confirmed: false로 둔다.
version: 2026-10-28

required_docs:
  대물: [수리견적서]
  대인: [진단서, 진료비내역]
  자차: [수리견적서]

# 피해 정도별 수리 견적 상한(원). 가상 기준.
estimate_limit:
  경미: 2000000
  보통: 8000000
  큼: null

# 경상 대인 8주룰. 자동차손해배상 보장법 시행령 개정, 2026-09-10 이후 사고부터 적용(보도 기준).
# 2026-10-28 다시 확인: 12~14급 염좌와 타박상, 사고일 기준, 7주 안에 진단서 등 제출,
# 임산부와 만 7세 이하는 검토 없이 치료(뉴스서울, 토요경제, SBS Biz 보도). 법제처 조문 원문은 아직 못 읽음.
# 임산부와 영유아 제외, 염좌와 타박상 한정은 이 저장소 입력에 진단명 구분이 없어 넣지 않았다.
eight_weeks:
  grades: [12, 13, 14]
  limit_days: 56
  notice_days: 49       # 사고 후 7주 서류 기한. 보도 여러 건이 같음, 조문 원문 확인 전
  notice_confirmed: false

route_strength:
  서류 보완: 3
  사람 심사: 2
  자동 처리 후보: 1

forbidden_phrases: [과실이 확정, 확정되었습니다, 지급되었습니다, 지급을 거절, 거절되었습니다]

# 안내문 읽기 기준. 이 저장소가 정한 가상 기준이며 평가 보고서에 참고로만 싣는다.
readability:
  max_sentence_chars: 60
  jargon: [과실상계, 구상, 면책, 부책, 대위, 귀책, 수정요소, 가감요소, 소급, 기왕증]
