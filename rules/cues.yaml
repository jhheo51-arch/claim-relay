# 진술 요소 단서 낱말. 규칙 추출기(cues)가 쓰고, 값마다 찾은 낱말을 근거로 남긴다.
# AI 추출기는 이 표를 쓰지 않고 원문 인용(quote)을 직접 남긴다.
place:
  신호없는교차로: [신호등이 없는 교차로, 신호 없는 교차로]
  신호교차로: [신호등이 있는 교차로, 신호 있는 교차로]
  합류지점: [합류 구간, 차로가 줄어드는]
  단일로: [직선 도로, 직선도로]
move:
  진로변경: [차로를 바꾸, 차로 변경, 진로를 바꾸, 진로 변경, 차선을 바꾸]
  좌회전: [좌회전]
  우회전: [우회전]
  합류: [합류하]
  정지: [멈춰, 정차해, 서 있]
  직진: [직진, 곧장]
order:
  후행: [뒤에서, 뒤따라]
  선행: [앞에서, 앞서]
from:
  같은방향: [같은 방향]
  맞은편: [맞은편]
  오른쪽: [오른쪽 도로]
  왼쪽: [왼쪽 도로]
modifier:
  방향지시등 미작동: [깜빡이를 켜지 않, 방향지시등을 켜지 않]
  급정지: [급정거, 급정지]
  진로변경 금지장소: [실선]
  과속: [과속]
