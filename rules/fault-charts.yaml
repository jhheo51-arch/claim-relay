# 과실 도표 8개. 손해보험협회 과실비율정보포털의 도표 상세 페이지에서 옮김.
# 고른 기준: 포털 '과실도표 검색순위' 차 대 차 탭(최근 30일, 2026-10-28 조회)에서
# 주차, 주정차 도표를 빼고 움직이는 두 차의 사고 유형을 골랐다.
# confirmed: 사용자가 포털에서 값을 직접 대조하면 true로 바꾼다.
version: 2026-10-28
source: https://accident.knia.or.kr/ranking
moved_by: Claude, 도표 상세 페이지의 '기본 과실' 칸을 옮김
confirmed: true
confirmed_by: 사용자, 2026-10-28 대조표 검토 후 진행 승인

# 수정요소 참고값(modifiers): 도표 상세 페이지 '가감요소' 표에서 진술 수정요소 4가지에 맞는 줄만 옮김.
# 2026-10-28 Claude가 옮김, 사용자 대조 전. 담당자 카드에 참고로만 보이고 경로와 과실 계산에는 쓰지 않는다.
# party: 가산 대상 차(A, B, AB는 두 차 각각). add: 가산 상한(%p). 과속은 도표마다 별도 줄이 없어
# 현저한 과실(10) 또는 중대한 과실(20) 중 무엇으로 볼지 담당자가 정한다.
modifiers_confirmed: false
speeding_ref: {item: 현저한 과실 또는 중대한 과실, add: [10, 20]}

# 조건 키: move(내 진행), order(선행/후행), from(상대가 온 쪽). 적지 않은 키는 따지지 않는다
