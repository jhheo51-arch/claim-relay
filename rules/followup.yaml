# 사후 점검 신호. 안내문이 나간 뒤 고객이 다시 보낸 말에서 찾는다. 이 저장소가 정한 가상 기준이다.
# 위에서부터 먼저 걸린 신호의 조치를 따른다. 에이전트를 늘리지 않고, 담당자 대기열에 다시 올리는 표시만 한다.
version: 2026-10-28
signals:
  - id: 민원
    words: [금감원, 금융감독원, 민원, 소송, 변호사, 신고하겠]
    action: 담당자 바로 배정, 응대 기록 남김
  - id: 과실 이의
    words: [과실, 억울, 인정 못, 인정할 수 없, 납득]
    action: 사람 심사로 다시 열기
  - id: 안내 이해 못함
    words: [무슨 말, 이해가 안, 모르겠, 뭘 내라]
    action: 안내문 문구 점검 표시
  - id: 진행 문의
    words: [언제, 아직, 연락이 없, 얼마나 걸]
    action: 진행 상황 다시 안내
# 같은 사고로 이만큼 다시 물으면 신호가 없어도 담당자에게 올린다
repeat_limit: 2
